services:
  scarlet:
    build: .
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_PATH: ./server/data/scarlet.db
      JWT_SECRET: replace-with-a-long-random-production-secret
      ADMIN_EMAIL: owner@example.com
      ADMIN_PASSWORD: replace-with-a-unique-production-password
    volumes:
      - scarlet-data:/app/server/data
    restart: unless-stopped

volumes:
  scarlet-data:
